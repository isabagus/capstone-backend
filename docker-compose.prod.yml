# =====================================================================
# Docker Compose — CV SIP Inventory & Production ERP
# Dijalankan di dalam: LXC Docker (10.10.10.60) di folder /opt/new-inventory
# =====================================================================

services:
  sip-backend:
    container_name: sip-inventory-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${SIP_BACKEND_PORT:-8010}:8080"
    environment:
      APP_NAME: "CV SIP Inventory ERP"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:-base64:8mX9kP2vL5nQ7wR1tY4uI6oP3aS0dF2gH5jK8lZ1xC4=}"
      APP_URL: "${APP_URL:-http://localhost:8010}"
      # Koneksi ke LXC Database (PostgreSQL / MySQL)
      DB_CONNECTION: "${DB_CONNECTION:-pgsql}"
      DB_HOST: "${DB_HOST:-10.10.10.61}"
      DB_PORT: "${DB_PORT:-5432}"
      DB_DATABASE: "${DB_DATABASE:-sip_inventory_erp}"
      DB_USERNAME: "${DB_USERNAME:-sip_user}"
      DB_PASSWORD: "${DB_PASSWORD:-sip_secret_password}"
      SESSION_DRIVER: file
      CACHE_STORE: file
      QUEUE_CONNECTION: sync
    volumes:
      - sip_backend_storage:/var/www/html/storage
    networks:
      - sip-net

  sip-frontend:
    container_name: sip-inventory-frontend
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_INTERNAL_URL: "http://sip-backend:8080"
        NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-/new-inventory}"
    restart: unless-stopped
    ports:
      - "${SIP_FRONTEND_PORT:-3010}:3000"
    environment:
      NODE_ENV: production
      BACKEND_INTERNAL_URL: "http://sip-backend:8080"
      NEXT_PUBLIC_BASE_PATH: "${NEXT_PUBLIC_BASE_PATH:-/new-inventory}"
    depends_on:
      - sip-backend
    networks:
      - sip-net

volumes:
  sip_backend_storage:

networks:
  sip-net:
    driver: bridge

